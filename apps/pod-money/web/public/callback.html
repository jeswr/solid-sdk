<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing you in… · Pod Money</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
             display: grid; place-items: center; min-height: 100vh; margin: 0;
             color: #14302a; background: #f1f8f4; }
      p { font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <p>Signing you in…</p>
    <script>
      // Hand the authorization code back to the app window that opened this popup
      // (@solid/reactive-authentication's getCode() is awaiting it). Target OUR
      // origin only — the URL carries the OAuth code; never broadcast to "*".
      if (window.opener) {
        window.opener.postMessage(location.href, "https://solid-pod-chat.vercel.app");
      }
    </script>
  </body>
</html>
