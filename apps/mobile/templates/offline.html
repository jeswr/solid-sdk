<!doctype html>
<!-- AUTHORED-BY Claude Opus 5.5 -->
<!-- server.errorPath: shown when the suite origin cannot be reached. No Capacitor bridge here. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'"
    />
    <title>Solid Suite · Offline</title>
    <style>
      :root { color-scheme: light dark; --fg: #1b1b1f; --bg: #ffffff; --accent: #5b3fd1; }
      @media (prefers-color-scheme: dark) { :root { --fg: #e6e1e9; --bg: #141218; --accent: #c9bfff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
        color: var(--fg); font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 28rem; text-align: center; }
      h1 { font-size: 1.375rem; margin: 0 0 8px; }
      .button { display: inline-block; text-decoration: none; font: inherit; padding: 10px 20px; border-radius: 999px; border: 0; background: var(--accent);
        color: var(--bg); cursor: pointer; min-height: 44px; }
      .button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Solid Suite couldn't reach its server. Check your connection and try again.</p>
      <a class="button" href="{{SUITE_URL}}">Try again</a>
    </main>
  </body>
</html>
