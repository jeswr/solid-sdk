    <h1>Finishing the connection…</h1>
    <p>You can close this window after the connection completes.</p>
    <script>
      const message = { type: "pod-manager-oauth", url: location.href };
      if (window.opener) window.opener.postMessage(message, location.origin);

      channel.close();
      history.replaceState(null, "", location.pathname);
