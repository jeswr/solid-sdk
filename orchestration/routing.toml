# Routing table for issue-native orchestration of jeswr/solid-sdk (PUBLIC — no account information).
# Maps a triaged issue's role/labels to a MODEL fallback-chain + the agent that implements it. The
# private account registry (jeswr/agent-account-registry) consumes `model_chain` to pick the first
# AVAILABLE account (respecting per-account limits + the lease + cache affinity). This file is the
# `routing` pointer named by this repo's row in the registry's `policy/repos.toml`.
#
# PRECEDENCE (consumer contract): security-label overrides > explicit role > [defaults]. Rules are
# evaluated top-to-bottom, FIRST MATCH WINS, so the `match_labels` blocks are listed FIRST.
#
# match_labels SEMANTICS: a rule matches if ANY of the issue's labels CONTAINS a listed keyword as a
# SUBSTRING (so `auth` matches `area:solid-api-auth`, `area:auth-solid` and `area:solid-auth-core`).
# role rules match the exact `role:<r>` label.
#
# THE MODEL CATALOG BELOW IS COPIED VERBATIM from sparq-org/sparq's orchestration/routing.toml so the
# two targets resolve aliases identically. It is duplicated rather than referenced because the
# registry reads each target's table independently and a cross-repo include would be a new trust
# edge; when the catalog changes, both files change together.

[models.haiku]
provider = "anthropic"
harness = "claude"
provider_model = "claude-haiku-4-5"   # NOT a routing target (2026-07-26): haiku no longer appears in
                                      # any model_chain — the maintainer moved DOCS WRITING off the
                                      # cheap anthropic tiers onto sol. The catalog entry is retained
                                      # because non-routing consumers still name it (the harness
                                      # `.claude/agents/*.md` mechanical roles: sparq-pkg-nl NL
                                      # retrieval, sparq-verify-mechanical, sparq-context-monitor)
                                      # and registry account records list it in `models`.
credential_format = "claude-oauth-token"
[models.sonnet]
provider = "anthropic"
harness = "claude"
provider_model = "claude-sonnet-4-6"  # NOT a routing target (2026-07-26): same as haiku above.
                                      # Non-routing consumers: sparq-rust-impl (bulk single-crate
                                      # implementation) + sparq-issue-sweeper (triage) agent configs.
credential_format = "claude-oauth-token"
[models.opus5]
provider = "anthropic"
harness = "claude"
provider_model = "claude-opus-5"       # Opus 5 — the SOLE anthropic routing tier since 2026-07-26.
                                       # It replaced fable (claude-fable-5) and opus (claude-opus-4-8)
                                       # as the primary tier on 2026-07-24; the 2026-07-26 directive
                                       # deprecated both entirely, so they are gone from this catalog
                                       # rather than retained as tail fallbacks. Chains that used to
                                       # end at fable/opus now either end at opus5 and DEFER on
                                       # exhaustion (retried next tick) or carry `escalate = true`
                                       # and park to needs:user — never a silent degrade.
                                       # Probe-verified live 2026-07-26: `claude --model
                                       # claude-opus-5 -p` -> OK, modelUsage reports canonicalModel
                                       # "claude-opus-5" (1M context). ALWAYS pin the full id: the
                                       # bare `opus` alias tracked claude-opus-4-8 for days after
                                       # Opus 5 shipped. Mirrors the registry's routing.toml.
credential_format = "claude-oauth-token"
[models.terra]
provider = "openai"
harness = "codex"
provider_model = ""                    # EMPTY = omit --model (codex CLI default). The literal "TBD" placeholder
                                       # reached `codex exec --model TBD` in every terra fleet worker -> API 400 /
                                       # no-tool-call fallback (2026-07-18). Never ship a placeholder id here.
                                       # sentinel is load-bearing: dispatch/worker pass NO --model flag
credential_format = "codex-auth-json"
[models.sol]
provider = "openai"
harness = "codex"
provider_model = "gpt-5.6-sol"         # Cross-provider REVIEW model (maintainer 2026-07-18): the registry
                                       # REVIEW_CHAIN routes reviews of anthropic-authored CONTENT to
                                       # `sol`. Distinct alias from `terra` (a different GPT model); id
                                       # probed working on the worker account type 2026-07-18.
credential_format = "codex-auth-json"
[models.luna]
provider = "openai"
harness = "codex"
provider_model = "gpt-5.6-luna"        # Second tier of the unified fix ladder opus<luna<fable<opus5<sol
                                       # (maintainer 2026-07-18) + sol's review fallback; id probed
                                       # working on the worker account type 2026-07-18.
credential_format = "codex-auth-json"


[defaults]
model_chain = ["opus5", "sol"]
agent = "solid-app-builder"

# ---------------------------------------------------------------------------------------------------
# SECURITY / SOUNDNESS OVERRIDES (first-match; win over role). This monorepo's trust surfaces are
# the authentication, authorization, credential and access-control packages. They run on Opus 5
# ALONE and, on chain-exhaustion, ESCALATE to a human (needs:user) rather than degrade to a weaker
# or cross-provider tier — the same fail-closed posture sparq applies to its zk/mpc surfaces.
[[route]]
match_labels = ["auth", "dpop", "webauthn", "solid-vc", "authz", "odrl", "pod-guard",
                "guarded-fetch", "federation-trust", "openid"]
model_chain = ["opus5"]
agent = "solid-data-modeler"
escalate = true

# ---------------------------------------------------------------------------------------------------
# ROLE ROUTES. Implementation leads with Opus 5 (maintainer directive 2026-07-26), EXCEPT UI work,
# where sol leads — the same carve-out sparq's `role:site`/`role:gui` routes carry.
[[route]]
role = "impl"
model_chain = ["opus5"]
agent = "solid-app-builder"

[[route]]
role = "site"
model_chain = ["sol", "opus5"]
agent = "solid-frontend-dev"

[[route]]
role = "ci"
model_chain = ["opus5", "sol"]
agent = "solid-devops"

[[route]]
role = "docs"
model_chain = ["sol", "opus5"]
agent = "solid-app-builder"

[[route]]
role = "research"
model_chain = ["opus5", "sol"]
agent = "solid-app-orchestration"
