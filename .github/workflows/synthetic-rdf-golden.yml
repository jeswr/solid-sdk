# AUTHORED-BY Claude Opus 5.5
# Cross-platform golden tests for synthetic-rdf. Split from the gate so the scarce macOS
# runners only build when synthetic-rdf or its workspace dependency changes.
name: synthetic-rdf golden

on:
  pull_request:
    paths:
      - "packages/synthetic-rdf/**"
      - "packages/rdf-serialize/**"
      - ".github/workflows/synthetic-rdf-golden.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "packages/synthetic-rdf/**"
      - "packages/rdf-serialize/**"
      - ".github/workflows/synthetic-rdf-golden.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: synthetic-rdf-golden-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-rdf-golden:
    name: synthetic-rdf golden (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@jeswr/synthetic-rdf
      - run: pnpm --filter @jeswr/synthetic-rdf test
