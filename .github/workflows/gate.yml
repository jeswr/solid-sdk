# AUTHORED-BY Claude Fable 5
# The workspace gate. NOTE: GitHub Actions is currently account-billing-blocked for this
# estate — until restored, the same gate runs LOCALLY (`pnpm run gate`) before every push,
# per the suite discipline. This workflow arms automatically when billing returns.
name: gate

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its queued or running gate; main pushes always run in full.
concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff-aware --affected needs history
      # turbo --affected reads GITHUB_BASE_REF ("main") on pull_request events, but a
      # PR checkout has no local `main` ref (only origin/main + the merge ref), so base
      # resolution fails and turbo falls back to running EVERY task. Pin the documented
      # TURBO_SCM_BASE override to the PR's base SHA — always resolvable under
      # fetch-depth: 0. Push builds on main intentionally keep the full run.
      - name: Resolve --affected base (pull requests)
        if: github.event_name == 'pull_request'
        run: echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gate

  # AUTHORED-BY Codex GPT-6
  suite-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Suite workspace dependencies
        run: pnpm exec turbo run build --filter='@jeswr/app-suite^...'
      - name: Export native Suite (manifest and per-page CSP)
        run: pnpm --filter @jeswr/app-suite build:native
      - name: Scan fixtures, verify CSP, report bundle size (40 MB maximum)
        run: pnpm --filter @jeswr/app-suite check:native
      - name: Install Chromium for native export browser tests
        working-directory: apps/suite
        run: |
          # The runner image already carries Chromium's system libraries. If the
          # apt mirrors are unreachable, fall back to the browser download alone.
          timeout 600 pnpm exec playwright install --with-deps chromium \
            || { echo "::warning::playwright --with-deps failed; installing Chromium without system deps"; pnpm exec playwright install chromium; }
      - name: Exercise native export routing under the final CSP
        run: pnpm --filter @jeswr/app-suite test:native-browser
