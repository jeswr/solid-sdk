# AUTHORED-BY Claude Opus 5.5
# Cloud builds of the iOS and Android shells (solid-suite-planning specs/mobile/DESIGN.md D8).
# Debug builds only; no signing material exists in this repository.
name: mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/suite-native/**"
      - ".github/workflows/mobile.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/suite-native/**"
      - ".github/workflows/mobile.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jeswr/app-mobile run sync:android
      - name: Gradle lint, unit tests, debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: solid-suite-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/mobile/android/app/build/reports/
            apps/mobile/android/app/build/test-results/
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Capacitor 8 needs Xcode 26 or later; pick the newest installed one, never the image default.
      - name: Select Xcode 26+
        run: |
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$xcode" || { echo "No Xcode 26+ on this runner"; ls /Applications; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jeswr/app-mobile run sync:ios
      - name: Simulator compile (no signing)
        working-directory: apps/mobile/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build
