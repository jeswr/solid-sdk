# AUTHORED-BY Claude Opus 5.5
name: answerable-explorer

# Deploys the public Answerable explorer (answerableagents.org, Vercel project
# answerable-explorer) whenever main changes the site, the Errand app it hosts at app/, or the
# specs it renders. Jesse approved production deploys of this project on every site change
# (21 Nov 2026). The site is static: scripts/build-public.mjs writes it (leaving out the
# internal roadmap) in a job without secrets, and a second job deploys the built files with the
# Vercel CLI as a prebuilt static output.
on:
  push:
    branches: [main]
    paths:
      - apps/agent-explorer/**
      - apps/agent-chat/**
      - packages/agent-consent/**
      - packages/agent-model/**
      - docs/specs/agent/**
      - pnpm-lock.yaml
      - tsconfig.base.json
      - turbo.json
      - .github/workflows/answerable-explorer.yml
  workflow_dispatch:

permissions:
  contents: read

# Runs queue rather than cancel, so a deployment in progress is never interrupted.
concurrency:
  group: answerable-explorer-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_gEDQJDOVUapnHCzWwvyxaIB2
  VERCEL_PROJECT_ID: prj_9r9z3AMuYPM8S5WtCRLG33i2EyIz
  VERCEL_CLI: vercel@65.4.0

jobs:
  # Builds the site with repository code and no secrets.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the Errand app and its workspace dependencies
        run: pnpm install --frozen-lockfile --filter "@jeswr/app-agent-chat..."
      - name: Build the Errand app as one self-contained page
        run: |
          pnpm exec turbo run build --filter="@jeswr/app-agent-chat^..."
          pnpm --filter @jeswr/app-agent-chat run build:artifact
      - name: Build the public site
        run: |
          site="$RUNNER_TEMP/answerable-site"
          AX_APP_DIR="$PWD/apps/agent-chat/dist-artifact" node apps/agent-explorer/scripts/build-public.mjs "$site"
          for f in index.html data/bundle.js app/index.html paper/index.html media/answerable-walkthrough.mp4; do
            test -s "$site/$f" || { echo "missing $f"; exit 1; }
          done
          node apps/agent-explorer/scripts/check-public-bundle.mjs "$site"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: answerable-site
          path: ${{ runner.temp }}/answerable-site
          if-no-files-found: error
          retention-days: 3

  # Deploys the built files. No repository code runs in this job, so nothing the build ran can
  # reach the token.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: answerable-site
          path: answerable-site
      # The built files are uploaded as they are: the deploy job never runs `vercel build`, so
      # nothing in the artifact (a vercel.json, a package.json, an api/ folder) can choose a
      # command to run with the token.
      - name: Stage the files as a static prebuilt output
        run: |
          mkdir -p deploy/.vercel/output
          mv answerable-site deploy/.vercel/output/static
          printf '{"version":3}\n' > deploy/.vercel/output/config.json
          printf '{"target":"production","builds":[]}\n' > deploy/.vercel/output/builds.json
          test -s deploy/.vercel/output/static/index.html
      - name: Deploy to production
        working-directory: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --archive=tgz \
            --meta "explorerCommitSha=$GITHUB_SHA" --token "$VERCEL_TOKEN")
          echo "Deployed $GITHUB_SHA to answerableagents.org: $url" | tee -a "$GITHUB_STEP_SUMMARY"
