name: agent-daemon-container
on:
  pull_request:
    paths:
      - 'apps/agent-daemon/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.github/workflows/agent-daemon-container.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-css:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f apps/agent-daemon/Containerfile -t agent-daemon:check .
      - name: Refuse unconfigured production startup
        run: |
          if docker run --rm --network none agent-daemon:check; then
            echo 'Unconfigured cloud host unexpectedly started'
            exit 1
          fi
      - name: Build CSS test image
        run: docker build -f apps/agent-daemon/Containerfile --target css-test -t agent-daemon:css .
      - name: Run A-012 CSS flow and cloud regressions on distroless Node 24
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges agent-daemon:css
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dev deployment locally (no Azure authentication)
        run: |
          curl --fail --silent --show-error --location https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64 -o "$RUNNER_TEMP/bicep"
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" build apps/agent-daemon/deploy/gitops/dev.bicep --outfile "$RUNNER_TEMP/agent-daemon-dev.json"
          node apps/agent-daemon/test/check-cloud-template.mjs "$RUNNER_TEMP/agent-daemon-dev.json"
