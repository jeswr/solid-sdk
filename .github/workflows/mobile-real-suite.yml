# AUTHORED-BY Codex GPT-6
name: Mobile real-suite Android E2E

on:
  pull_request:
    paths:
      - "apps/suite/**"
      - "apps/mobile/**"
      - "packages/suite-native/**"
      - "packages/pod-auth/**"
      - ".github/workflows/mobile-real-suite.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/suite/**"
      - "apps/mobile/**"
      - "packages/suite-native/**"
      - "packages/pod-auth/**"
      - ".github/workflows/mobile-real-suite.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: mobile-real-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-real-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Build suite SDK dependencies
        run: pnpm exec turbo run build --filter='@jeswr/app-suite^...'
      - name: Check mobile host assertions
        run: pnpm --filter @jeswr/app-mobile test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          # udev applies the rule asynchronously; wait briefly before declaring KVM missing.
          for _ in $(seq 1 15); do
            if test -r /dev/kvm && test -w /dev/kvm; then exit 0; fi
            sleep 2
          done
          ls -l /dev/kvm || echo "/dev/kvm is missing on this runner"
          exit 1
      - name: Install Android SDK and API 35 emulator image
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          # yes can receive SIGPIPE once sdkmanager has consumed all licence answers.
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64"
      - name: Create and boot the AVD
        timeout-minutes: 10
        run: |
          mkdir -p apps/mobile/e2e/artifacts
          # avdmanager and the emulator disagree on the default AVD directory on hosted runners.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name suite-e2e --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          emulator -avd suite-e2e -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel on > apps/mobile/e2e/artifacts/emulator.log 2>&1 &
          emulator_pid=$!
          booted=0
          # A wall-clock deadline inside the step timeout, so a failure reaches the diagnostics steps.
          deadline=$((SECONDS + 420))
          while [ "$SECONDS" -lt "$deadline" ]; do
            kill -0 "$emulator_pid" || { cat apps/mobile/e2e/artifacts/emulator.log; exit 1; }
            if [ "$(timeout 10 adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 2
          done
          test "$booted" = "1" || { echo "Android boot timed out"; exit 1; }
          timeout 10 adb shell input keyevent 82
          timeout 10 adb shell settings put global window_animation_scale 0
          timeout 10 adb shell settings put global transition_animation_scale 0
          timeout 10 adb shell settings put global animator_duration_scale 0
      - name: Build and exercise the real bundled suite
        run: node apps/mobile/e2e/android-real-suite.mjs
      - name: Collect sanitized emulator logcat
        if: failure()
        timeout-minutes: 1
        run: node apps/mobile/e2e/android-real-suite.mjs --collect-logcat
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-real-suite-diagnostics
          path: |
            apps/mobile/e2e/artifacts/report-real-suite.json
            apps/mobile/e2e/artifacts/emulator.log
            apps/mobile/e2e/artifacts/logcat-real-suite.txt
          retention-days: 7
